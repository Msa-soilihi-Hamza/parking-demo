services:
  db:
    image: postgres:17-alpine
    container_name: escale-parking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: escale
      POSTGRES_PASSWORD: escale
      POSTGRES_DB: escale
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escale -d escale"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
